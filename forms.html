<!-- Not a page — exists only so Netlify's build-time bot detects these
     forms (both render client-side in Red Spider Studios.dc.html, so
     Netlify can't see them in the deployed markup without this static copy). -->
<form name="newsletter" data-netlify="true" hidden>
  <input type="email" name="email" />
</form>
<form name="Submitted from RSS" data-netlify="true" hidden>
  <input type="text" name="name" />
  <input type="email" name="email" />
  <textarea name="message"></textarea>
</form>
<form name="Submitted from RSSA" data-netlify="true" hidden>
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="brand" />
  <textarea name="message"></textarea>
</form>
